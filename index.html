<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CMANS Office Hub — Prototype</title><style>
:root{font-family:Arial,'Noto Sans Thai',sans-serif;color:#1d2b44;background:#f3f5f9}*{box-sizing:border-box}body{margin:0}header{height:94px;background:#1d2b44;color:white;display:flex;align-items:center;justify-content:space-between;padding:20px 30px}header img{width:170px;max-height:48px;object-fit:contain;object-position:left}header small{color:#a9bed9;display:block;margin-top:6px}header select{background:#2b3b57;color:white;border:1px solid #51637e;padding:9px;border-radius:8px}.layout{display:grid;grid-template-columns:230px minmax(0,1fr);min-height:calc(100vh - 94px)}aside{background:white;border-right:1px solid #e0e6ef;padding:24px 13px}aside h5{color:#96a4b8;margin:0 14px 12px}aside button{display:flex;align-items:center;gap:12px;width:100%;border:0;background:transparent;text-align:left;padding:13px 15px;color:#64748b;border-radius:10px;cursor:pointer;font-size:14px}aside button.active{background:#eaf0f8;color:#345d98;font-weight:bold}main{padding:26px 30px;max-width:1300px;width:100%;margin:auto}.crumb{color:#5274ae;font-size:12px}h1{margin:8px 0;font-size:26px}p.sub{color:#8c9bb0;margin:0 0 22px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:#fff;border:1px solid #e0e6ef;border-radius:16px;padding:20px;margin-bottom:15px}.stat small{color:#73849b}.stat strong{display:block;font-size:29px;margin-top:18px}.two{display:grid;grid-template-columns:1.3fr 1fr;gap:15px}.three{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.bar{height:9px;background:#e5eaf1;border-radius:9px;overflow:hidden;margin:12px 0 18px}.bar i{display:block;height:100%;background:#4d6ca5;border-radius:9px}h3{margin:0 0 20px;font-size:18px}button.primary{background:#4169a4;color:white;border:0;border-radius:9px;padding:11px 16px;cursor:pointer}button.secondary{background:#eef2f8;color:#3b5f91;border:1px solid #dce4ee;border-radius:9px;padding:10px 14px;cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}.actions{display:flex;gap:9px;flex-wrap:wrap;margin:14px 0}.muted{color:#7b8ba1;font-size:13px}.pill{display:inline-block;background:#fff3df;color:#966521;border-radius:18px;padding:5px 10px;font-size:12px}.good{background:#e5f4ed;color:#267653}.bad{background:#fce9e9;color:#b04b4b}label{display:block;color:#64748b;font-size:12px;margin:12px 0 5px}input,select,textarea{width:100%;border:1px solid #dce3ed;border-radius:9px;padding:11px;background:white;color:#1d2b44;font:inherit}textarea{min-height:80px}.formgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:0 18px}.full{grid-column:1/-1}table{border-collapse:collapse;width:100%;font-size:13px}th,td{padding:12px;border-bottom:1px solid #e7ebf2;text-align:left}th{color:#667a96;background:#f6f8fb}td input{min-width:65px;padding:8px}td input[type=number]{width:95px}.scroll{overflow-x:auto}.hide{display:none!important}.notice{background:#edf3fa;padding:13px;border-radius:10px;color:#3d628f;font-size:13px;margin:12px 0}.donut{width:125px;height:125px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(#4d6ca5 0 75%,#e4eaf1 75%);margin:auto}.donut:before{content:'75%';display:grid;place-items:center;width:94px;height:94px;background:white;border-radius:50%;font-size:25px;font-weight:bold}.footer{font-size:12px;color:#96a4b8;margin-top:25px}@media(max-width:900px){.layout{grid-template-columns:170px 1fr}.cards{grid-template-columns:repeat(2,1fr)}.two,.three{grid-template-columns:1fr}main{padding:20px}aside button{font-size:12px}}@media(max-width:600px){.layout{display:block}aside{display:flex;overflow:auto;padding:8px}aside h5{display:none}aside button{min-width:max-content}header{height:auto;padding:15px}header img{width:115px}.formgrid{grid-template-columns:1fr}}
@media print{header,aside,.actions,.footer,.notice,.crumb{display:none!important}.layout{display:block}main{padding:0}.card{border:1px solid #aaa;break-inside:avoid}body{background:white}input,select,textarea{border:0;padding:4px}}

.action-bar{border-top:1px solid #e4e9f1;padding-top:18px}.draft-btn,.submit-btn,.print-btn,.danger-outline{border-radius:9px;padding:10px 15px;cursor:pointer;font-weight:600}.draft-btn{background:#fff5df;color:#8d650e;border:1px solid #f1d49a}.submit-btn{background:#287954;color:white;border:1px solid #287954}.print-btn{background:#4169a4;color:white;border:1px solid #4169a4}.danger-outline{background:white;color:#ba4c55;border:1px solid #eccbd0;padding:6px 9px;font-size:12px}.form-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.form-head h3{margin-bottom:4px}.section-title{margin:25px 0 12px}.payment-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px 20px}.payment-line{display:grid;grid-template-columns:145px 1fr;align-items:center;gap:9px}.payment-line label{margin:0}.custompay{margin-top:5px}.entry-table input{width:100%;min-width:75px}.entry-table td{vertical-align:middle}.entry-table td:nth-child(2){min-width:180px}.num{text-align:right;white-space:nowrap}.totals{max-width:350px;margin:10px 0 25px auto}.totals div{display:flex;justify-content:space-between;padding:7px 4px}.totals .grand{border-top:2px solid #243854;font-weight:700}.attn-box{background:#f8fafc;border:1px solid #e1e8f1;border-radius:12px;padding:14px;margin:12px 0}.attn-title{font-weight:700;color:#253b59}.checks{display:grid;grid-template-columns:1fr 1fr;gap:7px}.checks label{font-size:13px;display:flex;align-items:center;gap:7px;margin:0}.checks input{width:auto}.two-fields{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin:15px 0}.comparison td,.comparison th{min-width:100px}.comparison td:first-child,.comparison th:first-child{min-width:45px}.comparison td:nth-child(2){min-width:200px}.comparison small{display:block;color:#64748b;margin-top:5px}.summary{background:#f1f5fa;font-weight:700}.signature-hint{font-size:12px;color:#73839c;margin:15px 0}.project-meta{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:18px 0}.project-meta div{background:#f3f6fa;padding:13px;border-radius:10px;color:#64748b;font-size:12px}.project-meta strong{display:block;font-size:20px;color:#1d2b44;margin-top:6px}.donut{position:relative}.donut:before{display:none}.donut-value{background:white;border-radius:50%;width:94px;height:94px;display:grid;place-items:center;font-size:26px;font-weight:700}.workflow-step{margin:10px 0}.workflow-step b{float:right;color:#4d6ca5}.workflow-step .bar{clear:both;margin:7px 0 13px}.gantt-head{display:grid;grid-template-columns:110px repeat(5,1fr);font-size:11px;color:#64748b}.gantt-row{display:grid;grid-template-columns:110px 1fr;align-items:center;font-size:11px;padding:9px 0;border-bottom:1px solid #edf1f5}.gantt-track{height:12px;position:relative;background:repeating-linear-gradient(90deg,#f0f3f8 0,#f0f3f8 19%,#fff 19%,#fff 20%);border-radius:6px}.gantt-track i{position:absolute;top:1px;height:10px;background:#5477ad;border-radius:5px}.scurve svg{width:100%;height:auto}.module-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.module-btn{border:1px solid #e2e8f0;background:#f5f7fb;border-radius:9px;padding:15px;color:#314d78;cursor:pointer;text-align:left;display:flex;justify-content:space-between}@media(max-width:900px){.payment-grid,.two-fields{grid-template-columns:1fr}.project-meta{grid-template-columns:repeat(2,1fr)}.module-grid{grid-template-columns:repeat(2,1fr)}}@media print{.action-bar{display:none}}
.upload-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.upload-card{border:1px dashed #b6c4d7;border-radius:10px;padding:14px;background:#fbfcfe}.upload-card input{max-width:100%}@media(max-width:750px){.upload-grid{grid-template-columns:1fr}}</style>
<style>

.nav-group{margin:6px 0}.nav-toggle{font-weight:700!important;color:#334d70!important;background:#f4f7fb!important;justify-content:space-between}.nav-items{padding:3px 0 7px 13px;border-left:2px solid #e5ebf4;margin-left:10px}.nav-items button{padding:10px!important;font-size:13px!important}

</head><body><header><div><img alt="CMANS logo" src="cmans-logo.png"><small>OFFICE HUB · INTERNAL MANAGEMENT SYSTEM</small></div><div><label style="color:#a9bed9;margin:0 0 5px">ทดลองสิทธิ์ผู้ใช้</label><select id="role" onchange="roleChanged()"><option value="owner">Owner / Director</option><option value="accounting">Accounting</option><option value="manager">Project Manager</option><option value="employee">Employee</option></select></div></header><div class="layout"><aside><h5>WORKSPACE</h5><div id="nav"></div></aside><main><div class="crumb">CMANS / WORKSPACE</div><h1 id="heading">ภาพรวมบริษัท</h1><p class="sub" id="subtitle">ระบบบริหารจัดการงานภายในบริษัท</p><div id="content"></div><div class="footer">CMANS Office Hub · Interactive design prototype · ข้อมูลจำลอง · ยังไม่เชื่อมระบบอนุมัติจริง</div></main></div><script>
const nav=[['dashboard','▦','ภาพรวมบริษัท'],['projects','▣','โครงการ'],['rfa','▤','RFA · ขออนุมัติ'],['pr','▧','ใบขอซื้อ PR'],['compare','≋','เปรียบเทียบราคา'],['po','▥','ใบสั่งซื้อ PO'],['boq','▦','BOQ / ประมาณราคา'],['vendors','♧','ทะเบียนผู้ขาย'],['finance','◫','การเงินและบัญชี'],['approvals','✓','ศูนย์อนุมัติ'],['history','◷','เอกสารและ Activity Log']];let active='dashboard';let records=JSON.parse(localStorage.getItem('cmans_records')||'[]');let rows=[{desc:'เหล็กกลม 6×10M SR24',qty:517,unit:'เส้น',price:44.87},{desc:'เหล็กกลม 9×10M SR24',qty:194,unit:'เส้น',price:96.86},{desc:'เหล็กข้ออ้อย 12×10M SD40',qty:226,unit:'เส้น',price:175.1}];const fmt=n=>'฿'+Number(n||0).toLocaleString('th-TH',{maximumFractionDigits:2});const field=(label,id,value='',type='text')=>`<div><label>${label}</label><input id="${id}" type="${type}" value="${value}"></div>`;const select=(label,id,options)=>`<div><label>${label}</label><select id="${id}">${options.map(x=>`<option>${x}</option>`).join('')}</select></div>`;const txt=(label,id,value='')=>`<div class="full"><label>${label}</label><textarea id="${id}">${value}</textarea></div>`;const get=id=>document.getElementById(id)?.value||'';function roleChanged(){render()}function role(){return get('role')}function canFinance(){return ['owner','accounting'].includes(role())}function setPage(id){if(id==='finance'&&!canFinance())return;active=id;render()}function render(){document.getElementById('nav').innerHTML=nav.filter(n=>n[0]!=='finance'||canFinance()).map(n=>`<button class="${active===n[0]?'active':''}" onclick="setPage('${n[0]}')"><span style="font-size:18px;width:20px">${n[1]}</span>${n[2]}</button>`).join('');document.getElementById('heading').textContent=nav.find(n=>n[0]===active)?.[2]||'';const pages={dashboard:dashboard,projects:projects,rfa:rfa,pr:()=>procurement('PR'),po:()=>procurement('PO'),compare:compare,daily:daily,boq:boq,vendors:vendors,finance:finance,approvals:approvals,history:history};document.getElementById('content').innerHTML=(pages[active]||dashboard)()};function dashboard(){return `<div class="cards">${[['โครงการที่ดำเนินการ','12'],['เอกสารรออนุมัติ',String(records.filter(x=>x.status==='รออนุมัติ').length).padStart(2,'0')],['งานที่ต้องติดตาม','06'],['เอกสารเดือนนี้','24']].map(x=>`<div class="card stat"><small>${x[0]}</small><strong>${x[1]}</strong></div>`).join('')}</div><div class="two"><div class="card"><h3>ภาพรวมโครงการ</h3>${[['COPA Sport Club',75],['Office Renovation',55],['Tennis Clubhouse',40]].map(x=>`<div style="display:flex;justify-content:space-between"><span>${x[0]}</span><b style="color:#4d6ca5">${x[1]}%</b></div><div class="bar"><i style="width:${x[1]}%"></i></div>`).join('')}<button class="secondary" onclick="setPage('projects')">ดู Project Monitoring</button></div><div class="card"><h3>สถานะโครงการ</h3><div class="donut"></div><p class="muted" style="text-align:center">COPA · Actual Progress</p><div class="notice">Planned 85% · Actual 75% · ต่ำกว่าแผน 10 จุดเปอร์เซ็นต์</div></div></div>${canFinance()?`<div class="card"><h3>Financial Snapshot <span class="pill">Owner / Accounting only</span></h3><div class="three"><div>เงินรับโครงการ<br><b>${fmt(1950000)}</b></div><div>ลูกหนี้คงค้าง<br><b>${fmt(600000)}</b></div><div>เงินสดและธนาคาร<br><b>${fmt(875000)}</b></div></div></div>`:''}<div class="card"><h3>เมนูลัด</h3><div class="actions"><button class="secondary" onclick="setPage('rfa')">+ สร้าง RFA</button><button class="secondary" onclick="setPage('pr')">+ สร้าง PR</button><button class="secondary" onclick="setPage('compare')">+ Compare ราคา</button><button class="secondary" onclick="setPage('approvals')">รายการรออนุมัติ</button></div></div>`}function projects(){return `<div class="cards">${[['COPA Sport Club',75,85],['Office Renovation',55,60],['Tennis Clubhouse',40,65]].map(x=>`<div class="card"><h3>${x[0]}</h3><div class="bar"><i style="width:${x[1]}%"></i></div><b>Actual ${x[1]}%</b><p class="muted">Planned ${x[2]}% · Gap ${x[1]-x[2]} pp</p><span class="pill">${x[1]-x[2]<-15?'ล่าช้า':'ติดตาม'}</span></div>`).join('')}</div><div class="card"><h3>Project Workflow</h3><p>RFA → Approved Drawings → BOQ → PR → Price Comparison → PO → Goods Receipt → Actual Cost</p></div>`}function formActions(type){return `<div class="actions"><button class="secondary" onclick="save('${type}','ฉบับร่าง')">บันทึก Draft</button><button class="primary" onclick="save('${type}','รออนุมัติ')">ยืนยันและส่งอนุมัติ (Demo)</button><button class="secondary" onclick="window.print()">พิมพ์ / Save as PDF</button></div><div class="notice">เมื่อใช้งานจริงจะสร้าง PDF จาก Template บริษัท แนบเอกสาร ส่ง Notification ให้ผู้อนุมัติ และล็อก Revision หลังอนุมัติ · Prototype นี้ยังไม่ส่งให้เจ้าของจริง</div>`}function rfa(){return `<div class="card"><h3>Request for Approval (R.F.A.)</h3><p class="muted">อ้างอิงโครงสร้างจากไฟล์ RFA CMANS ที่แนบ · มี 4 ส่วนการตรวจสอบ</p><div class="formgrid">${field('Project','project','สนามเทนนิส')}${field('Ref. No.','ref','S25-DWG-ST-003')}${field('Owner','owner','')}${field('Location','location','คลองพระอุดม ปากเกร็ด นนทบุรี')}${field('Date','date','2026-10-29','date')}${select('Function','function',['Structure','Architectural','Electrical','Sanitary','Air Conditional','External Work'])}${field('Contractor’s Request Title','title','แบบผังบริเวณรวม')}${select('Subject','subject',['Shop Drawing','Material','Conceptual Drawing','Calculation (CAL)','Method','General'])}${field('Drawing / Specification Ref.','drawing','ST-01, ST-02, ST-03, ST-04')}${field('Attachment / No. of Pages','attachment','Shop Drawing 4 แผ่น')}${field('Attn / ผู้ตรวจสอบ','reviewer','')}${field('From / ผู้ยื่น','requester','')}${txt('รายละเอียด / หมายเหตุ','notes')}</div><div class="notice">Approval Route: (1) ผู้ยื่น → (2) ผู้ตรวจสอบ → (3) Owner → (4) ผู้เกี่ยวข้อง · ผลอนุมัติ: Approved / Approved as Note / Re-submit / Not Approved</div>${formActions('RFA')}</div>`}function itemTable(){return `<div class="scroll"><table><thead><tr><th>รายละเอียด</th><th>จำนวน</th><th>หน่วย</th><th>ราคา/หน่วย</th><th>รวม</th></tr></thead><tbody>${rows.map((r,i)=>`<tr><td><input id="desc${i}" value="${r.desc}"></td><td><input id="qty${i}" type="number" value="${r.qty}" oninput="updateTotal()"></td><td><input id="unit${i}" value="${r.unit}"></td><td><input id="price${i}" type="number" step="0.01" value="${r.price}" oninput="updateTotal()"></td><td id="line${i}">${fmt(r.qty*r.price)}</td></tr>`).join('')}</tbody></table></div><div style="text-align:right;margin-top:15px"><b id="sum">รวมก่อน VAT ${fmt(rows.reduce((s,r)=>s+r.qty*r.price,0))}</b><br><span class="muted">VAT 7% (กรณีที่ใช้) คำนวณในเอกสารจริงตามรายการ</span></div>`}function updateTotal(){let total=0;rows.forEach((r,i)=>{let v=Number(get('qty'+i))*Number(get('price'+i));total+=v;document.getElementById('line'+i).textContent=fmt(v)});document.getElementById('sum').textContent='รวมก่อน VAT '+fmt(total)}function procurement(type){return `<div class="card"><h3>${type==='PR'?'Purchase Requisition':'Purchase Order'} (${type})</h3><p class="muted">อ้างอิงไฟล์ PR/PO S25-ST-20261028-015 ที่แนบ</p><div class="formgrid">${field('Project / Package Name','project','โครงการก่อสร้างสนามกีฬาในร่ม')}${field('Project No.','projectno','S25')}${field('Document No.','ref',`${type}-S25-ST-20261028-015`)}${field('Date','date','2026-10-29','date')}${select('ประเภท','category',['Material','Contractor','General Expense'])}${field('Vendor / Supplier','vendor','')}${field('Quotation Reference','quotation','')}${field('Delivery Location','delivery','คลองพระอุดม นนทบุรี')}${field('Delivery Date','deliverydate','2026-10-31','date')}${select('Payment Term','payment',['โอน 100% ก่อนจัดส่ง','Credit 30 วัน','Credit 60 วัน','ชำระตามงวด'])}${select('Comparison Attached','comparison',['Yes','No — Urgent','No — Sole Supplier','No — Approved Vendor'])}${field('Requester','requester','')}${txt('เงื่อนไขเพิ่มเติม / หมายเหตุ','notes')}</div><h3 style="margin-top:22px">รายการวัสดุและราคา</h3>${itemTable()}<div class="actions"><button class="secondary" onclick="setPage('compare')">เปิดฟอร์ม Compare ราคา</button></div><div class="notice">Approval Route: Requester → Procurement / Project Control → Project Manager → Director / Owner · PO ควรออกจาก PR ที่ผ่านอนุมัติแล้ว</div>${formActions(type)}</div>`}const vendorOffers=[{name:'Vendor A',price:238500,delivery:5,quality:90,terms:75,trust:90,shipping:0},{name:'Vendor B',price:229000,delivery:10,quality:82,terms:90,trust:80,shipping:9000},{name:'Vendor C',price:247000,delivery:3,quality:96,terms:70,trust:95,shipping:0}];function score(v){const landed=v.price+v.shipping;const cheapest=Math.min(...vendorOffers.map(x=>x.price+x.shipping));return Math.round((cheapest/landed*100)*.45+v.quality*.25+Math.max(0,100-v.delivery*5)*.15+v.terms*.1+v.trust*.05)}function compare(){return `<div class="card"><h3>Vendor Price & Value Comparison</h3><p class="muted">ตัวอย่างเปรียบเทียบ 3 ผู้ขาย · เปลี่ยนราคาหรือเงื่อนไขได้เพื่อทดลองคะแนน</p><div class="formgrid">${field('Project','project','Tennis Court')}${field('Package','title','เหล็กกลม / เหล็กข้ออ้อย')}</div><div class="scroll"><table><thead><tr><th>Vendor</th><th>ราคา</th><th>ค่าขนส่ง</th><th>จัดส่ง (วัน)</th><th>คุณภาพ /100</th><th>Payment /100</th><th>เชื่อถือ /100</th><th>คะแนน</th></tr></thead><tbody>${vendorOffers.map((v,i)=>`<tr><td><input id="vname${i}" value="${v.name}"></td>${[['price',v.price],['shipping',v.shipping],['delivery',v.delivery],['quality',v.quality],['terms',v.terms],['trust',v.trust]].map(([k,n])=>`<td><input type="number" id="${k}${i}" value="${n}" oninput="recalcCompare()"></td>`).join('')}<td id="score${i}"><b>${score(v)}</b></td></tr>`).join('')}</tbody></table></div><p class="muted">เกณฑ์ตัวอย่าง: ราคาสุทธิรวมส่ง 45% · คุณภาพ 25% · ระยะเวลาจัดส่ง 15% · เงื่อนไขชำระ 10% · ความน่าเชื่อถือ 5%</p><div class="notice" id="recommendation">คะแนนสูงสุดเบื้องต้น: ${[...vendorOffers].sort((a,b)=>score(b)-score(a))[0].name} · ต้องตรวจสอบ Spec, VAT, มาตรฐาน และข้อเสนอจริงก่อนอนุมัติ</div><div class="formgrid">${field('Vendor ที่เสนอเลือก','vendor','Vendor A')}${txt('เหตุผลในการเลือก / ความคุ้มค่า','notes','ราคาเทียบกับคุณภาพ มาตรฐานวัสดุ และเงื่อนไขจัดส่ง')}</div>${formActions('COMPARE')}</div>`}function recalcCompare(){vendorOffers.forEach((v,i)=>['name','price','shipping','delivery','quality','terms','trust'].forEach(k=>v[k]=k==='name'?get('vname'+i):Number(get(k+i))));vendorOffers.forEach((v,i)=>document.getElementById('score'+i).textContent=score(v));let winner=[...vendorOffers].sort((a,b)=>score(b)-score(a))[0];document.getElementById('recommendation').textContent=`คะแนนสูงสุดเบื้องต้น: ${winner.name} (${score(winner)}/100) · ควรตรวจสอบ Spec และเงื่อนไขจริง`};function save(type,status){let project=get('project'),ref=get('ref')||`${type}-DEMO-${String(records.length+1).padStart(3,'0')}`;if(!project){alert('กรุณาระบุโครงการ');return}const rec={type,ref,project,status,created:new Date().toLocaleString('th-TH'),fields:{}};document.querySelectorAll('main input,main select,main textarea').forEach(el=>rec.fields[el.id]=el.value);records.unshift(rec);localStorage.setItem('cmans_records',JSON.stringify(records));alert(`บันทึก ${ref} เป็น ${status} ในเบราว์เซอร์นี้แล้ว\nยังไม่ได้ส่งแจ้งเตือนเจ้าของจริง`);setPage('history')}function approvals(){return `<div class="card"><h3>รายการรออนุมัติ</h3>${records.filter(x=>x.status==='รออนุมัติ').length?records.filter(x=>x.status==='รออนุมัติ').map((r)=>`<div style="padding:12px 0;border-bottom:1px solid #e7ebf2"><b>${r.ref}</b> · ${r.type}<p class="muted">${r.project} · ${r.created}</p>${role()==='owner'?`<button class="primary" onclick="approve('${r.ref}','อนุมัติแล้ว')">อนุมัติ</button> <button class="secondary" onclick="approve('${r.ref}','ส่งกลับแก้ไข')">ส่งกลับแก้ไข</button>`:'<span class="pill">รอ Owner ตรวจสอบ</span>'}</div>`).join(''):'<p class="muted">ยังไม่มีรายการรออนุมัติในข้อมูลจำลอง</p>'}</div>`}function approve(ref,status){let r=records.find(x=>x.ref===ref);if(r){r.status=status;r.approvedAt=new Date().toLocaleString('th-TH');localStorage.setItem('cmans_records',JSON.stringify(records));render()}}function history(){return `<div class="card"><h3>Document History & Activity Log</h3><div class="actions"><button class="secondary" onclick="exportCSV()">ส่งออกรายการ CSV (เปิดใน Excel)</button></div><div class="scroll"><table><thead><tr><th>เลขเอกสาร</th><th>ประเภท</th><th>โครงการ</th><th>สถานะ</th><th>บันทึกเมื่อ</th></tr></thead><tbody>${records.map(r=>`<tr><td>${r.ref}</td><td>${r.type}</td><td>${r.project}</td><td>${r.status}</td><td>${r.created}</td></tr>`).join('')||'<tr><td colspan="5">ยังไม่มีเอกสารที่บันทึก</td></tr>'}</tbody></table></div></div>`}function exportCSV(){let data=[['เลขเอกสาร','ประเภท','โครงการ','สถานะ','บันทึกเมื่อ'],...records.map(r=>[r.ref,r.type,r.project,r.status,r.created])];let csv='\ufeff'+data.map(row=>row.map(x=>'"'+String(x).replaceAll('"','""')+'"').join(',')).join('\r\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='CMANS_Document_History.csv';a.click();URL.revokeObjectURL(a.href)}function boq(){return `<div class="card"><h3>BOQ & Cost Estimation</h3><p>Quick Estimate · Detailed BOQ · Material Price Library · BOQ Revisions</p><button class="secondary" onclick="setPage('pr')">สร้าง PR จากรายการวัสดุ</button></div>`}function vendors(){return `<div class="card"><h3>Vendor Management</h3><p>Company Profile · Contact · Category · Quotation History · Performance</p><button class="secondary" onclick="setPage('compare')">เปรียบเทียบผู้ขาย</button></div>`}function finance(){return `<div class="cards">${[['เงินรับโครงการ',1950000],['ลูกหนี้คงค้าง',600000],['เจ้าหนี้คงค้าง',229000],['เงินสดและธนาคาร',875000]].map(x=>`<div class="card stat"><small>${x[0]}</small><strong style="font-size:21px">${fmt(x[1])}</strong></div>`).join('')}</div><div class="card"><h3>Finance & Accounting</h3><p>Project Payments · Accounts Receivable / Payable · Cash Flow · Bank Reconciliation · Tax Register · Monthly Closing</p><p class="muted">เฉพาะ Owner / Accounting · ข้อมูลจำลอง</p></div>`}/* v2 overrides loaded below */
</script><script src="enhancements.js"></script><script src="payment-package.js"></script><script src="v4.js"></script><script src="v5.js"></script><script src="v6.js"></script><script src="v7.js"></script><script src="v8.js"></script><script src="v9.js"></script><script src="v10.js"></script><script src="official-materials.js"></script><script src="official-labor.js"></script><script src="v11.js"></script><script>render();</script></body></html>
